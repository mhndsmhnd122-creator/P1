name: Kick to Restream Auto-Monitor

on:
  workflow_dispatch:

jobs:
  keep-streaming:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Environment
        run: |
          sudo apt update
          sudo apt install -y ffmpeg python3-pip
          pip3 install --upgrade pip
          pip3 install --upgrade --force-reinstall git+https://github.com/streamlink/streamlink.git

      - name: Start Continuous Monitor & Stream
        run: |
          chmod +x stream.sh
          ./stream.sh
